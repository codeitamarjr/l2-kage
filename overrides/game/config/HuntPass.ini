# L2 Kage: the Hunt Pass is on, Premium costs 1,000 L-Coin and a step takes 300 points (overrides/game; the original is
# in dist/game/config). Keep the rewards (data/HuntPass.xml) as they are: the client draws them from its own files.
# --------------------------------------------------------------------------
# HuntPass Settings
# --------------------------------------------------------------------------
EnabledHuntPass = True

# Period to end.
# Retail 1 month.
DayOfMonth = 16

# Pass Premium Cost.
# Retail is 3600 L-Coin. L2 Kage: 1000, the L-Coin every new character starts with.
PremiumItemId = 91663
PremiumItemCount = 1000

# Please take caution when changing anything.
# Required Points per Window or step.
# L2 Kage: 300 (1 point per monster, 2 in timed hunting zones), so steps are reachable in a play session.
PointsForStep = 300
